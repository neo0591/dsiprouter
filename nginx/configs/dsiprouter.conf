# setup the dsiprouter server group (using unix sockets)
# if multiple instances are running they can be configured here
upstream dsiprouter {
   server unix:DSIP_UNIX_SOCK;
}

map $http_x_forwarded_proto $dsip_fwd_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

map $http_x_forwarded_port $dsip_fwd_port {
    default $http_x_forwarded_port;
    ""      443;
}

# handle the https requests
server {
    # by default we listen on all interfaces
    listen DSIP_PORT ssl http2 so_keepalive=on;
    listen [::]:DSIP_PORT ssl http2 so_keepalive=on;
    server_name _;

    ssl_certificate DSIP_SSL_CERT;
    ssl_certificate_key DSIP_SSL_KEY;

    # UFI log uploads (upload-file) can exceed the 1MB nginx default
    client_max_body_size 64m;

    # reverse proxy for dsiprouter websocket (UFI commands)
    location /ufi-app/ufi/websocket {
        proxy_pass http://127.0.0.1:15001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # UFI cloud reverse admin (Flask → WS admin_http_proxy → device 127.0.0.1)
    location ~ ^/api/v1/ufi/devices/[^/]+/admin-proxy {
        proxy_pass http://dsiprouter;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    # reverse proxy for dsiprouter
    location / {
        proxy_pass http://dsiprouter;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /stirshaken_certs {
         alias /etc/dsiprouter/certs/stirshaken;
    }


    # redirect http to https when this TLS port is hit directly
    error_page 497 https://$host:DSIP_PORT$request_uri;
}

# Internal HTTP origin for uuWAF / other reverse proxies on :443.
# Public HTTPS stays on the WAF so the browser URL is https://host/ (no :5000).
server {
    listen 127.0.0.1:5080;
    server_name _;

    client_max_body_size 64m;

    location /ufi-app/ufi/websocket {
        proxy_pass http://127.0.0.1:15001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dsip_fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $dsip_fwd_port;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/ufi/devices/[^/]+/admin-proxy {
        proxy_pass http://dsiprouter;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dsip_fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $dsip_fwd_port;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://dsiprouter;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dsip_fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $dsip_fwd_port;
    }

    location /stirshaken_certs {
         alias /etc/dsiprouter/certs/stirshaken;
    }
}